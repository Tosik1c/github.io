<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Роза ASCII</title>
<style>
:root{--bg1:#2b0b17;--bg2:#06020a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b0b17;--bg2:#06020a}}
:root[data-theme="dark"]{--bg1:#2b0b17;--bg2:#06020a}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg2)}
body{background:radial-gradient(ellipse at 50% 40%,var(--bg1),var(--bg2) 70%)}
canvas{display:block;width:100%;height:100%;cursor:pointer}
</style>
</head>
<body>
<canvas id="c" aria-label="Анимация: ASCII-роза распускается, затем появляется надпись «Пойдем кофэ попьем»"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const RAMP=' .:-=+*#%@', SP=['.','+','*','*','+','.'];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>x*x*(3-2*x);
const hash=(a,b,c=0)=>{const h=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453;return h-Math.floor(h)};
const TT=7.6;
const LEAVES=[{dir:1,k:0.38,th:0.55,s:2.4},{dir:-1,k:0.64,th:0.5,s:3.0}];
let C,R,W,H,cw,ch,asp,fpx,dpr,D,DH,bc,bk,start=performance.now(),last=0,parts=[];

function setup(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  fpx=clamp(W/90,8,16);
  ctx.font='bold '+fpx+'px "Courier New",monospace';
  cw=ctx.measureText('M').width;ch=Math.round(fpx*1.05);asp=ch/cw;
  C=Math.floor(W/cw);R=Math.floor(H/ch);
  bc=new Array(R*C);bk=new Array(R*C);
  buildText();
}

function buildText(){
  const lines=C<100?['Пойдем','кофэ','попьем']:['Пойдем','кофэ попьем'];
  const n=lines.length,S=3,lh=1.3,GAP=0.16;
  const o=document.createElement('canvas');o.width=C*S;o.height=R*S;
  const x=o.getContext('2d',{willReadFrequently:true});
  const F=s=>'400 '+s+'px Arial,Helvetica,sans-serif';
  x.font=F(100);
  const em=Math.max(...lines.map(l=>[...l].reduce((s,k)=>s+x.measureText(k).width,0)/100+GAP*(l.length-1)));
  const fs=Math.min(C*0.88/em,(R*asp*0.5)/(n*lh));
  x.setTransform(S,0,0,S,0,0);x.scale(1,1/asp);
  x.font=F(fs);x.textAlign='left';x.textBaseline='middle';
  x.fillStyle=x.strokeStyle='#fff';x.lineWidth=0.25;x.lineJoin='round';
  const cy=R*0.42*asp,gp=fs*GAP;
  lines.forEach((l,i)=>{
    const y=cy+(i-(n-1)/2)*fs*lh,ws=[...l].map(k=>x.measureText(k).width);
    let x0=C/2-(ws.reduce((a,b)=>a+b,0)+gp*(l.length-1))/2;
    [...l].forEach((k,j)=>{x.strokeText(k,x0,y);x.fillText(k,x0,y);x0+=ws[j]+gp;});
  });
  const px=x.getImageData(0,0,C*S,R*S).data;
  D=[];for(let r=0;r<R+2;r++)D.push(new Float32Array(C));
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    let s=0;
    for(let j=0;j<S;j++)for(let i=0;i<S;i++)s+=px[((r*S+j)*C*S+c*S+i)*4+3];
    D[r][c]=s/(255*S*S);
  }
  DH=[];for(let r=0;r<R+2;r++)DH.push(new Float32Array(C));
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){let m=0;for(let j=-2;j<=2;j++)for(let i=-3;i<=3;i++){const rr=r+j,cc=c+i;if(rr>=0&&rr<R&&cc>=0&&cc<C&&D[rr][cc]>m)m=D[rr][cc];}DH[r][c]=m;}
}

function put(c,r,chr,col){
  if(c<0||c>=C||r<0||r>=R)return;
  const i=r*C+c;bc[i]=chr;bk[i]=col;
}

function frame(now){
  requestAnimationFrame(frame);
  const t=(now-start)/1000,dt=Math.min(0.1,(now-last)/1000||0.016);last=now;
  bc.fill('');
  const cx=C/2,hy=R*0.36,HR=Math.min(C*0.2,R*asp*0.22),span=R-hy;
  const g=ease(clamp(t/2)),b=ease(clamp((t-1.8)/5.2)),bud=clamp((g-0.85)/0.15);
  const sway=Math.sin(t*0.9)*0.7*clamp(b*2);
  const sp=0.2+b*0.8;
  const sx=r=>cx+sway*(1-clamp((r-hy)/span))+3.2*Math.sin((r-hy)*0.11)*Math.min(1,Math.max(0,(r-hy)/8));
  const rowTop=R-g*span;

  // стебель
  for(let r=Math.ceil(Math.max(hy,rowTop));r<R;r++){
    const x=sx(r),s=sx(r+1)-x,xc=Math.round(x);
    put(xc,r,Math.abs(s)<0.35?'|':(s>0?'\\':'/'),'hsl(125,70%,40%)');
    put(xc+1,r,':','hsl(130,60%,26%)');
    if(r%11===3)put(xc+2,r,'>','hsl(120,60%,34%)');
    if(r%11===8)put(xc-1,r,'<','hsl(120,60%,34%)');
  }

  // листья
  for(const L of LEAVES){
    const lg=ease(clamp((t-L.s)/2.2));
    const ar=hy+span*L.k;
    if(lg<0.03||ar<rowTop)continue;
    const ax=sx(ar),len=HR*1.35*lg,wid=len*0.24;
    const dx=L.dir*Math.cos(L.th),dy=-Math.sin(L.th);
    const rr=Math.ceil(len/asp)+2,cc=Math.ceil(len)+2;
    for(let r=Math.floor(ar-rr);r<=ar+rr;r++)for(let c=Math.floor(ax-cc);c<=ax+cc;c++){
      const px=c-ax,py=(r-ar)*asp;
      const u=px*dx+py*dy,v=-px*dy+py*dx;
      if(u<0||u>len)continue;
      const hw=wid*Math.sin(Math.PI*Math.pow(u/len,0.8));
      const av=Math.abs(v);
      if(av>hw)continue;
      if(av<0.9)put(c,r,'=','hsl(115,70%,48%)');
      else{const q=av/hw;put(c,r,q>0.75?':':(q>0.4?'+':'*'),'hsl(128,65%,'+Math.round(40-q*14)+'%)');}
    }
  }

  // бутон / роза
  const hx=cx+sway;
  if(bud>0){
    const R0=HR*(0.22+0.78*b)*bud,sy=1.5-0.5*b,ph0=(1-b)*3.5+t*0.15;
    const rows=Math.ceil(R0*sy/asp)+3,cols=Math.ceil(R0*1.3)+3;
    for(let r=Math.floor(hy-rows);r<=hy+rows;r++)for(let c=Math.floor(hx-cols);c<=hx+cols;c++){
      const px=c-hx,py=(r-hy)*asp/sy;
      const rad=Math.hypot(px,py),a=Math.atan2(py,px);
      const bound=R0*(1+0.11*b*Math.cos(5*a+0.6)+0.06*b*Math.cos(3*a-0.8)+0.02*b*Math.sin(t*3+a*4));
      if(rad>bound){
        const s=(py-R0*0.85)/(R0*0.4);
        if(s>0&&s<1&&Math.abs(px)<R0*0.65*(1-s)+0.6)put(c,r,s<0.5?'V':'Y','hsl(125,65%,36%)');
        continue;
      }
      const q=rad/bound;
      const w=0.5+0.5*Math.sin(q*13+a*2+ph0);
      let br=0.2+0.55*w+0.25*(1-q);
      if(q>0.9)br=0.95;
      const idx=clamp(Math.floor(br*10),1,9);
      let chr=RAMP[idx],col='hsl(352,88%,'+Math.round(16+br*44)+'%)';
      if(q>0.9)col='hsl(348,95%,68%)';
      if(hash(c,r,Math.floor(t*8))<0.012*sp){chr='*';col='hsl(340,100%,92%)';}
      put(c,r,chr,col);
    }
  }

  // отрисовка розы
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.font='bold '+fpx+'px "Courier New",monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.globalAlpha=1-0.7*clamp((t-TT)/2.5);
  for(let i=0;i<bc.length;i++){
    if(!bc[i])continue;
    ctx.fillStyle=bk[i];
    ctx.fillText(bc[i],(i%C)*cw+cw/2,((i/C)|0)*ch+ch/2);
  }

  // блёстки
  if(t>1.8){
    let n=dt*45*sp;
    while(n>0&&parts.length<400){
      if(Math.random()<n){
        let x,y;
        if(Math.random()<0.65){
          const a=Math.random()*6.283,d=Math.sqrt(Math.random())*HR*1.25*(0.3+0.7*b);
          x=hx+Math.cos(a)*d;y=hy+Math.sin(a)*d/asp;
        }else{
          y=hy+HR/asp*0.6+Math.random()*(R-hy-HR/asp*0.6);
          x=sx(y)+(Math.random()-0.5)*HR*1.3;
          if(y<rowTop)y=-1;
        }
        if(y>=0){
          const k=Math.random();
          parts.push({x,y,t0:t,life:0.5+Math.random()*1,vy:0.8+Math.random()*2,col:k<0.5?'#ffffff':(k<0.8?'#ffe9a8':'#ff9ec0')});
        }
      }
      n--;
    }
  }
  parts=parts.filter(p=>(t-p.t0)/p.life<1);
  for(const p of parts){
    const age=(t-p.t0)/p.life;
    ctx.globalAlpha=1-age*0.6;ctx.fillStyle=p.col;
    ctx.fillText(SP[Math.floor(age*SP.length)],Math.round(p.x)*cw+cw/2,Math.round(p.y-age*p.life*p.vy)*ch+ch/2);
  }

  // надпись
  if(t>TT){
    const tt=t-TT;
    const sy=Math.sin(tt*1.6)*clamp((tt-2.6)/1.2)*1.7;
    ctx.globalAlpha=1;
    for(let r=0;r<R;r++){
      const rt=r-sy,r0=Math.floor(rt),f=rt-r0;
      const A=D[r0],B=D[r0+1],HA=DH[r0],HB=DH[r0+1];
      if(!A&&!B)continue;
      for(let c=0;c<C;c++){
        const d=(A?A[c]:0)*(1-f)+(B?B[c]:0)*f;
        const dh=(HA?HA[c]:0)*(1-f)+(HB?HB[c]:0)*f;
        if(dh<0.12)continue;
        const tr=(c/C)*1.7+hash(c,r)*0.8;
        if(tt<tr-0.4)continue;
        ctx.fillStyle='rgba(8,2,8,0.9)';
        ctx.fillRect(c*cw,r*ch,cw+0.5,ch+0.5);
        if(d<0.3)continue;
        let chr,col;
        if(tt<tr){
          chr='@#%&*+=$?'[Math.floor(hash(c,r,Math.floor(t*20))*9)];
          col='hsl(45,100%,'+Math.round(70+hash(r,c,Math.floor(t*20))*30)+'%)';
        }else{
          chr=d>0.65?'@':(d>0.45?'#':'%');
          const sh=Math.sin(tt*3+c*0.25+r*0.4);
          col='hsl(42,100%,'+Math.round(80+6*sh)+'%)';
        }
        ctx.fillStyle=col;
        ctx.fillText(chr,c*cw+cw/2,r*ch+ch/2);
      }
    }
  }
  ctx.globalAlpha=1;
}

cv.addEventListener('click',()=>{start=performance.now();parts=[];});
addEventListener('resize',setup);
setup();
requestAnimationFrame(frame);
</script>
</body>
</html>
